<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <script>
      // Layout and input capabilities cover Safari, Chrome and embedded browsers.
      const mobileWidth = matchMedia("(max-width: 700px)"),
        mobileLandscape = matchMedia(
          "(orientation: landscape) and (max-height: 700px)",
        ),
        coarsePointer = matchMedia("(pointer: coarse)");
      function syncMobileExperience() {
        const mobile =
          coarsePointer.matches &&
          (mobileWidth.matches || mobileLandscape.matches);
        document.documentElement.classList.toggle("mobile-experience", mobile);
        const viewport = window.visualViewport,
          width = viewport?.width || innerWidth,
          height = viewport?.height || innerHeight,
          root = document.documentElement,
          computed = getComputedStyle(root),
          inset = (side) =>
            parseFloat(computed.getPropertyValue("--viewport-safe-" + side)) ||
            0,
          top = inset("top"),
          bottom = inset("bottom"),
          left = inset("left"),
          right = inset("right"),
          scale = Math.max(
            0.1,
            Math.min(
              (width - left - right - 24) / 422,
              (height - top - bottom - 24) / 914,
              1,
            ),
          );
        root.style.setProperty("--mobile-viewport-height", height + "px");
        root.style.setProperty("--mobile-viewport-width", width + "px");
        root.style.setProperty("--mobile-device-scale", String(scale));
        root.style.setProperty("--device-fit-x", (left - right) / 2 + "px");
        root.style.setProperty("--device-fit-y", (top - bottom) / 2 + "px");
      }
      syncMobileExperience();
      [mobileWidth, mobileLandscape, coarsePointer].forEach((query) =>
        query.addEventListener("change", syncMobileExperience),
      );
      addEventListener("resize", syncMobileExperience);
      addEventListener("orientationchange", syncMobileExperience);
      window.visualViewport?.addEventListener("resize", syncMobileExperience);
    </script>

    <link rel="preconnect" href="https://embed.music.apple.com" crossorigin />
    <link rel="preconnect" href="https://is1-ssl.mzstatic.com" crossorigin />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta

    <title>Les archives de KAIROS</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="v8.css" />
    <link rel="icon" href="assets/icons/music.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/pwa/kairos-192.png" />
    <meta name="apple-mobile-web-app-title" content="KAIROS" />
  </head>
  <body>
    <main class="experience">
      <section id="phoneScene" class="phone-scene active">
        <div id="device" class="device">
          <div class="screen">
            <div id="statusBar" class="status-bar light-status">
              <span id="statusTime">00:00</span>
              <span class="status-icons" aria-hidden="true">
                <svg viewBox="0 0 24 16" class="status-cell">
                  <rect x="1" y="10" width="3" height="5" rx="1" />
                  <rect x="6" y="7" width="3" height="8" rx="1" />
                  <rect x="11" y="4" width="3" height="11" rx="1" />
                  <rect x="16" y="1" width="3" height="14" rx="1" />
                </svg>
                <svg viewBox="0 0 22 16" class="status-wifi">
                  <path
                    d="M1.5 5.8C7.2.8 14.8.8 20.5 5.8M5 9c3.7-3.1 8.3-3.1 12 0M8.6 12.1c1.5-1.2 3.3-1.2 4.8 0"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                </svg>
                <span class="battery-pill"
                  ><span id="batteryLevel"></span
                ></span>
              </span>
            </div>
            <div class="dynamic-island"></div>

            <section id="lock" class="view lock-view active-view">
              <div class="lock-overlay"></div>
              <div class="lock-center">
                <span class="lock-padlock" aria-hidden="true"
                  ><svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect x="6" y="10" width="12" height="11" rx="3" />
                    <path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg
                ></span>
                <div id="lockDate" class="lock-date"></div>
                <div id="lockTime" class="lock-time"></div>
              </div>
              <div class="lock-notifications"></div>
              <div class="lock-shortcuts">
                <button
                  id="lockFlashlight"
                  aria-label="Lampe torche"
                  aria-pressed="false"
                ></button
                ><button id="lockCamera" aria-label="Appareil photo"></button>
              </div>
              <button id="unlockBtn" class="unlock" aria-label="Déverrouiller">
                Balayez vers le haut pour ouvrir
              </button>
            </section>

            <section id="home" class="view home-view">
              <div class="home-shade"></div>
              <div class="home-grid">
                <button class="app-icon" data-route="messages">
                  <img alt="" src="assets/icons/messages.png" /><span
                    >Messages</span
                  >
                </button>
                <button class="app-icon" data-route="calendar">
                  <span class="calendar-icon"
                    ><b id="calendarDay">5</b><small>JEU.</small></span
                  ><span>Calendrier</span>
                </button>
                <button class="app-icon" data-route="photos">
                  <img alt="" src="assets/icons/photos.png" /><span
                    >Photos</span
                  >
                </button>
                <button class="app-icon" data-route="camera">
                  <img alt="" src="assets/icons/camera.png" /><span
                    >Appareil photo</span
                  >
                </button>

                <button class="app-icon" data-route="facetime">
                  <span class="app-art"
                    ><img alt="" src="assets/icons/facetime.png" /></span
                  ><span>FaceTime</span>
                </button>
                <button class="app-icon" data-route="notes">
                  <img alt="" src="assets/icons/notes.png" /><span>Notes</span>
                </button>
                <button class="app-icon" data-route="files">
                  <img alt="" src="assets/icons/files.png" /><span
                    >Fichiers</span
                  >
                </button>
                <button class="app-icon" data-route="music">
                  <img alt="" src="assets/icons/music.png" /><span
                    >Musique</span
                  >
                </button>

                <button class="app-icon has-badge" data-route="whatsapp">
                  <img alt="" src="assets/icons/whatsapp.png" /><i>1</i
                  ><span>WhatsApp</span>
                </button>
                <button class="app-icon" data-route="spotify">
                  <img alt="" src="assets/icons/spotify.png" /><span
                    >Spotify</span
                  >
                </button>
                <button class="app-icon" data-route="instagram">
                  <img alt="" src="assets/icons/instagram.png" /><span
                    >Instagram</span
                  >
                </button>
                <button class="app-icon" data-route="settings">
                  <span class="app-art"
                    ><img alt="" src="assets/icons/settings.png" /></span
                  ><span>Réglages</span>
                </button>
              </div>
              <div class="dock liquid">
                <button data-route="phone" aria-label="Téléphone">
                  <img src="assets/icons/phone.png" alt="Téléphone" />
                </button>
                <button data-route="messages">
                  <img src="assets/icons/messages.png" alt="Messages" />
                </button>
                <button data-route="safari" aria-label="Safari">
                  <img src="assets/icons/safari.png" alt="Safari" />
                </button>
                <button data-route="music">
                  <img src="assets/icons/music.png" alt="Musique" />
                </button>
              </div>
            </section>

            <section id="appView" class="view app-view">
              <div id="appContent" class="app-content"></div>
            </section>

            <aside
              id="storyNotification"
              class="story-notification hidden"
              aria-live="polite"
            ></aside>
            <div id="modal" class="modal hidden"></div>
            <div
              id="toast"
              class="toast hidden"
              role="status"
              aria-live="polite"
            ></div>
            <button
              id="homeIndicator"
              class="home-indicator"
              aria-label="Retour à l’accueil"
            ></button>
          </div>
        </div>
      </section>
    </main>

    <script src="external-content.js" defer></script>
    <script src="apple-metadata.js" defer></script>

    <script src="soriak-sound.js" defer></script>
    <script src="living-os.js" defer></script>
    <script src="app.js" defer></script>
    <script src="soriak.js" defer></script>
  </body>
</html>
