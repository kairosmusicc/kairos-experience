<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Les archives de KAIROS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="experience">
    <section id="intro" class="intro active">
      <div class="intro-card">
        <img src="assets/images/logo.png" alt="Manii & Paapii" class="intro-logo" />
        <p class="eyebrow">ARCHIVES // KAIROS</p>
        <h1>Le téléphone<br>de KAIROS</h1>
        <p>Un téléphone. Quelques traces. Deux fichiers qui n’auraient peut-être pas dû rester là.</p>
        <button id="enterBtn" class="primary">Allumer le téléphone</button>
      </div>
    </section>

    <section id="phoneScene" class="phone-scene">
      <div id="device" class="device">
        <div class="screen">
          <div id="statusBar" class="status-bar light-status">
            <span id="statusTime">23:59</span>
            <span class="status-icons"><span class="bars">▮▮▮▮</span><span class="wifi">⌁</span><span class="battery">100%</span></span>
          </div>
          <div class="dynamic-island"></div>

          <section id="lock" class="view lock-view active-view">
            <div class="lock-overlay"></div>
            <div class="lock-center">
              <div id="lockDate" class="lock-date"></div>
              <div id="lockTime" class="lock-time"></div>
              <div class="lock-copy">Tu as trouvé le téléphone de KAIROS.</div>
            </div>
            <div class="lock-notifications">
              <button class="lock-notif" data-route="messages">
                <img src="assets/icons/messages.png" alt="" />
                <div><b>Messages</b><small>maintenant</small><strong>Paapii</strong><p>frérot t’as gardé le fichier ?</p></div>
              </button>
              <button class="lock-notif" data-route="whatsapp">
                <img src="assets/icons/whatsapp.png" alt="" />
                <div><b>WhatsApp</b><small>2 min</small><strong>Paapii</strong><p>j’ai retrouvé le mix</p></div>
              </button>
            </div>
            <button id="unlockBtn" class="unlock">Balayer vers le haut pour ouvrir ↑</button>
          </section>

          <section id="home" class="view home-view">
            <div class="home-grid">
              <button class="app-icon" data-route="messages"><img src="assets/icons/messages.png"><span>Messages</span></button>
              <button class="app-icon" data-route="photos"><img src="assets/icons/photos.png"><span>Photos</span></button>
              <button class="app-icon" data-route="notes"><img src="assets/icons/notes.png"><span>Notes</span></button>
              <button class="app-icon" data-route="files"><img src="assets/icons/files.png"><span>Fichiers</span></button>

              <button class="app-icon" data-route="camera"><img src="assets/icons/camera.png"><span>Appareil photo</span></button>
              <button class="app-icon" data-route="music"><img src="assets/icons/music.png"><span>Musique</span></button>
              <button class="app-icon has-badge" data-route="whatsapp"><img src="assets/icons/whatsapp.png"><i>1</i><span>WhatsApp</span></button>
              <button class="app-icon" data-route="spotify"><img src="assets/icons/spotify.png"><span>Spotify</span></button>

              <button class="app-icon" data-route="instagram"><img src="assets/icons/instagram.png"><span>Instagram</span></button>
              <button class="app-icon" data-route="settings"><span class="settings-icon">⚙︎</span><span>Réglages</span></button>
            </div>

            <div class="dock">
              <button data-route="phone"><img src="assets/icons/phone.png" alt="Téléphone"></button>
              <button data-route="messages"><img src="assets/icons/messages.png" alt="Messages"></button>
              <button data-route="safari"><img src="assets/icons/safari.png" alt="Safari"></button>
              <button data-route="music"><img src="assets/icons/music.png" alt="Musique"></button>
              <button data-route="whatsapp"><img src="assets/icons/whatsapp.png" alt="WhatsApp"></button>
            </div>
          </section>

          <section id="appView" class="view app-view">
            <div id="appContent" class="app-content"></div>
          </section>

          <div id="modal" class="modal hidden"></div>
          <div id="toast" class="toast hidden"></div>
          <button id="homeIndicator" class="home-indicator" aria-label="Retour à l’accueil"></button>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
