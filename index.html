<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000">
  <title>Les archives de KAIROS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="experience">
    <section id="intro" class="scene active intro">
      <div class="intro-card">
        <img src="assets/images/logo.png" class="intro-logo" alt="Manii & Paapii">
        <span class="intro-kicker">29.10.26 — 02:43</span>
        <h1>Les archives<br>de KAIROS</h1>
        <p>Un téléphone a été retrouvé. Certaines données sont encore accessibles.</p>
        <button id="powerBtn" class="primary-btn">Allumer le téléphone</button>
      </div>
    </section>

    <section id="phoneScene" class="scene phone-scene">
      <div class="device">
        <div class="screen">
          <div class="dynamic-island"></div>
          <div class="statusbar">
            <span>02:43</span>
            <div class="status-icons"><span class="signal">▮▮▮</span><span>◒</span><span class="battery">100%</span></div>
          </div>

          <section id="lockscreen" class="view lockscreen active-view">
            <div class="lock-main">
              <div class="lock-dot">●</div>
              <div class="lock-date">Jeudi 29 octobre</div>
              <div class="lock-time">02:43</div>
              <div class="lock-sub">Tu as trouvé le téléphone de KAIROS.</div>
            </div>

            <div class="lock-notifs">
              <button class="notif" data-route="messages">
                <img src="assets/icons/messages.png" alt="">
                <div class="notif-copy">
                  <div class="notif-head"><b>Messages</b><span>maintenant</span></div>
                  <strong>Paapii</strong>
                  <p>frérot t’as gardé le fichier ?</p>
                </div>
              </button>
              <button class="notif" data-route="photos">
                <img src="assets/icons/photos.png" alt="">
                <div class="notif-copy">
                  <div class="notif-head"><b>Photos</b><span>2 min</span></div>
                  <strong>Yoan</strong>
                  <p>Les selects sont prêts.</p>
                </div>
              </button>
            </div>

            <button id="unlockBtn" class="unlock">Balayer vers le haut pour ouvrir ↑</button>
          </section>

          <section id="home" class="view home-view">
            <div class="app-grid">
              <button class="app" data-route="messages"><img src="assets/icons/messages.png"><span>Messages</span></button>
              <button class="app" data-route="photos"><img src="assets/icons/photos.png"><span>Photos</span></button>
              <button class="app" data-route="notes"><img src="assets/icons/notes.png"><span>Notes</span></button>
              <button class="app" data-route="files"><img src="assets/icons/files.png"><span>Fichiers</span></button>

              <button class="app" data-route="camera"><img src="assets/icons/camera.png"><span>Appareil photo</span></button>
              <button class="app" data-route="music"><img src="assets/icons/music.png"><span>Musique</span></button>
              <button class="app badge" data-route="whatsapp"><img src="assets/icons/whatsapp.png"><em>1</em><span>WhatsApp</span></button>
              <button class="app" data-route="spotify"><img src="assets/icons/spotify.png"><span>Spotify</span></button>

              <button class="app" data-route="instagram"><img src="assets/icons/instagram.png"><span>Instagram</span></button>
              <button class="app" data-route="settings"><img src="assets/icons/settings.png"><span>Réglages</span></button>
            </div>

            <div class="dock">
              <button data-route="phone"><img src="assets/icons/phone.png"></button>
              <button data-route="messages"><img src="assets/icons/messages.png"></button>
              <button data-route="safari"><img src="assets/icons/safari.png"></button>
              <button data-route="music"><img src="assets/icons/music.png"></button>
              <button data-route="whatsapp"><img src="assets/icons/whatsapp.png"></button>
            </div>
          </section>

          <section id="appView" class="view app-view">
            <div id="appContent" class="app-content"></div>
          </section>

          <section id="incomingCall" class="view call-view">
            <div class="call-bg"></div>
            <div class="call-copy">
              <span>appel entrant</span>
              <h2>Numéro inconnu</h2>
              <p>peut-être : KAIROS</p>
            </div>
            <div class="call-actions">
              <button id="declineCall" class="call-btn decline"><i>×</i><span>Refuser</span></button>
              <button id="acceptCall" class="call-btn accept"><i>☎</i><span>Accepter</span></button>
            </div>
          </section>

          <section id="activeCall" class="view call-view">
            <div class="call-bg"></div>
            <div class="call-copy">
              <span id="callTimer">connecté — 00:00</span>
              <h2>Numéro inconnu</h2>
              <p>peut-être : KAIROS</p>
            </div>
            <div class="call-pad">
              <button><i>◉</i><span>silence</span></button>
              <button><i>⌨</i><span>clavier</span></button>
              <button><i>◖</i><span>haut-parleur</span></button>
            </div>
            <button id="hangupCall" class="hangup">☎</button>
            <audio id="callAudio" preload="metadata" src="assets/audio/call-0243.wav"></audio>
          </section>

          <button id="homeGesture" class="home-gesture" aria-label="Accueil"></button>
          <div id="toast" class="toast hidden"></div>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
